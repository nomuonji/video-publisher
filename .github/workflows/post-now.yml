name: Post Now

# Post one video immediately, outside the schedule (does not touch the schedule state).
on:
  workflow_dispatch:
    inputs:
      concept:
        description: Concept folder name under v-stock (e.g. ちんすけ)
        required: true
      video:
        description: File name in queue (e.g. 001-selfregi.mp4). Empty = random, like a scheduled run
        required: false
        default: ''
      platforms:
        description: Comma separated (YouTube,TikTok,Instagram). Empty = the concept's own settings
        required: false
        default: 'YouTube'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Post
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CONCEPT_NAME: ${{ inputs.concept }}
          VIDEO_NAME: ${{ inputs.video }}
          PLATFORMS: ${{ inputs.platforms }}
        run: npx tsx scripts/post-now.ts
